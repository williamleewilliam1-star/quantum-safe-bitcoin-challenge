name: BABYDOV block512 batch-scale synthetic

on:
  push:
    branches:
      - babydov/subset-block512-batchscale-synth-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3 libssl-dev ca-certificates
          rm -rf /var/lib/apt/lists/*
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile digest cubin and census
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          OUT=/tmp/qsbscale
          mkdir -p "$OUT"
          cd "$GITHUB_WORKSPACE/candidates/subset"
          nvcc -O3 -DQSB_ZEROS_N=24 -DQSB_CARRIER_BUILD=1 -arch=sm_89 -cubin -Xptxas -v \
            -o "$OUT/candidate.cubin" subset.cu >"$OUT/candidate.stdout" 2>"$OUT/candidate.ptxas"
          cuobjdump -sass "$OUT/candidate.cubin" > "$OUT/candidate.sass"
          sha256sum "$OUT/candidate.cubin" | tee "$OUT/candidate.cubin.sha256"
          python3 - <<'PY'
          import re,json,pathlib
          root=pathlib.Path('/tmp/qsbscale')
          ptx=(root/'candidate.ptxas').read_text(errors='replace')
          m=re.search(r"Compiling entry function '_Z13kernel_digest[^']*'.*?(?=ptxas info\s*: Compiling entry function|\Z)",ptx,re.S)
          sec=m.group(0) if m else ''
          def vals(p): return [int(x) for x in re.findall(p,sec)]
          out={'regs':(vals(r'Used (\d+) registers') or [None])[0],
               'stack':sum(vals(r'(\d+) bytes stack frame')),
               'spill_store':sum(vals(r'(\d+) bytes spill stores')),
               'spill_load':sum(vals(r'(\d+) bytes spill loads'))}
          print(json.dumps(out,indent=2))
          assert out == {'regs':127,'stack':0,'spill_store':0,'spill_load':0}, out
          PY
      - name: Regenerate native carrier and full host
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/qsbscale
          cd "$GITHUB_WORKSPACE/candidates/subset"
          NVCC="$(command -v nvcc)" CUOBJDUMP="$(command -v cuobjdump)" ./build_carrier.sh 24 | tee "$OUT/build_carrier.log"
          grep -E 'qsb_carrier_(cubin_sha256|source_sha256)' qsb_carrier_sm89.h | tee "$OUT/carrier_hashes.txt"
          cp qsb_carrier_sm89.h "$OUT/qsb_carrier_sm89.h"
          nvcc -O3 -DQSB_ZEROS_N=24 -o "$OUT/subset-full" subset.cu -lcrypto -lm >"$OUT/full.stdout" 2>"$OUT/full.stderr"
          test -x "$OUT/subset-full"
          echo FULL_BUILD_PASS
          grep -q '45b9b70ff74b1352232086a15231eee30f5303767b4afbe6c205ec8df5ec57b6' qsb_carrier_sm89.h
          echo CUBIN_IDENTICAL_TO_QUALIFIED_BLOCK512
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsb-block512-batchscale-synth
          retention-days: 7
          path: /tmp/qsbscale/*
