name: BABYDOV subset ALUZ static sweep

on:
  push:
    branches:
      - babydov/subset-aluz-sweep-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3 libssl-dev ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Checkout sweep branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify promoted subset base
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --check 8d07d3ebad41a017dfaa5906b164f883a9b59348..HEAD
          git diff --stat 8d07d3ebad41a017dfaa5906b164f883a9b59348..HEAD

      - name: Build ALUZ masks and collect SASS
        working-directory: candidates/subset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/aluz
          nvcc --version | tee /tmp/aluz/nvcc-version.txt
          for M in 0 1 2 3; do
            nvcc -O3 -DQSB_ZEROS_N=24 -DQSB_CARRIER_BUILD=1 -DQSB_SC_ALUZ=$M -arch=sm_89 -cubin               -Xptxas -v -o /tmp/aluz/m$M.cubin subset.cu 2> /tmp/aluz/m$M.ptxas
            cuobjdump -sass /tmp/aluz/m$M.cubin > /tmp/aluz/m$M.sass
            cuobjdump -symbols /tmp/aluz/m$M.cubin > /tmp/aluz/m$M.symbols
            sha256sum /tmp/aluz/m$M.cubin > /tmp/aluz/m$M.sha256
          done

      - name: Summarize digest kernel instruction mix
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          root=pathlib.Path('/tmp/aluz')
          out={}
          for m in range(4):
              sass=(root/f'm{m}.sass').read_text(errors='replace')
              ptx=(root/f'm{m}.ptxas').read_text(errors='replace')
              parts=re.split(r'\n\s*Function : ', sass)
              dig=next((p for p in parts if p.startswith('_Z13kernel_digest')), '')
              inst=[ln for ln in dig.splitlines() if re.search(r'/\*[0-9a-fA-F]{4,}\*/', ln)]
              def n(pat): return sum(bool(re.search(pat, ln)) for ln in inst)
              # capture all resource lines for the digest entry, plus aggregate spill mentions.
              digest_ptx=''
              mm=re.search(r"Compiling entry function '_Z13kernel_digest[^']*'.*?(?=ptxas info\s*: Compiling entry function|\Z)", ptx, re.S)
              if mm: digest_ptx=mm.group(0)
              regs=None
              mr=re.search(r'Used (\d+) registers', digest_ptx)
              if mr: regs=int(mr.group(1))
              spill_store=sum(int(x) for x in re.findall(r'(\d+) bytes spill stores', digest_ptx))
              spill_load=sum(int(x) for x in re.findall(r'(\d+) bytes spill loads', digest_ptx))
              stack=sum(int(x) for x in re.findall(r'(\d+) bytes stack frame', digest_ptx))
              out[str(m)]={
                  'instructions':len(inst),
                  'IMAD_all':n(r'\bIMAD'),
                  'IMAD_X':n(r'\bIMAD\.X'),
                  'IMAD_IADD':n(r'\bIMAD\.IADD'),
                  'IADD3_all':n(r'\bIADD3'),
                  'IADD3_X':n(r'\bIADD3\.X'),
                  'registers':regs,
                  'spill_stores_B':spill_store,
                  'spill_loads_B':spill_load,
                  'stack_B':stack,
                  'cubin_bytes':(root/f'm{m}.cubin').stat().st_size,
              }
          (root/'summary.json').write_text(json.dumps(out,indent=2)+'\n')
          lines=['mask instructions IMAD_all IMAD_X IMAD_IADD IADD3_all IADD3_X regs spillS spillL stack cubinB']
          for m,v in out.items():
              lines.append(f"{m} {v['instructions']} {v['IMAD_all']} {v['IMAD_X']} {v['IMAD_IADD']} {v['IADD3_all']} {v['IADD3_X']} {v['registers']} {v['spill_stores_B']} {v['spill_loads_B']} {v['stack_B']} {v['cubin_bytes']}")
          (root/'summary.txt').write_text('\n'.join(lines)+'\n')
          print((root/'summary.txt').read_text())
          PY

      - name: Upload sweep artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qsb-subset-aluz-static-sweep
          if-no-files-found: error
          retention-days: 7
          path: /tmp/aluz/*
