name: BABYDOV subset contig100 synthetic compile
on:
  push:
    branches: [babydov/subset-contig100-reserve-20260929]
jobs:
  compile:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libssl-dev python3 binutils
      - name: Build carrier and full candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/contig100
          cd candidates/subset
          NVCC="$(command -v nvcc)" CUOBJDUMP="$(command -v cuobjdump)" ./build_carrier.sh 24 | tee /tmp/contig100/build_carrier.log
          grep -m1 'cubin sha256' qsb_carrier_sm89.h | tee /tmp/contig100/carrier_stamp.txt
          grep -q 'cubin sha256 f74548427859ec03273f05e9151c810716c6475596e0213a0db3915e468aa5dc' qsb_carrier_sm89.h
          cp qsb_carrier_sm89.h /tmp/contig100/qsb_carrier_sm89.h
          nvcc -O3 -DQSB_ZEROS_N=24 -Xptxas=-v -o /tmp/contig100/subset-full subset.cu -lcrypto -lm             >/tmp/contig100/full.stdout 2>/tmp/contig100/full.stderr
          test -x /tmp/contig100/subset-full
          echo FULL_BUILD_PASS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsb-contig100-synth
          path: /tmp/contig100
